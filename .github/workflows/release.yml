# Builds Pebble desktop for macOS (signed + notarized), Windows and Linux.
#
# Push a tag vX.Y.Z (matching src-tauri/tauri.conf.json "version"): builds every
# platform into a draft GitHub release (installers), publishes each
# platform's signed updater bundle to eng-dash on the production track (the
# only update endpoint), then
# publishes the GitHub release once every build has passed.
#
# Run it by hand (Actions > Release > Run workflow) to build and publish to a
# tester track (internal, alpha, beta) without a GitHub release.
#
# Secrets: see README "Releases and auto-update".
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: eng-dash track to publish to
        default: internal
        type: choice
        options: [internal, alpha, beta]

permissions:
  contents: write

env:
  # Cargo's release strip corrupts proc-macro dylibs on macOS; keep symbols.
  CARGO_PROFILE_RELEASE_STRIP: "false"
  TRACK: ${{ github.event_name == 'push' && 'production' || inputs.track }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # updater: the bundle (+ .sig) the in-app updater installs, published to eng-dash.
          # Linux ships AppImage only: a .deb install can't apply AppImage updates.
          - { os: macos-latest, target: aarch64-apple-darwin, platform: darwin-aarch64, bundles: "app,dmg", updater: macos/Pebble.app.tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: darwin-x86_64, bundles: "app,dmg", updater: macos/Pebble.app.tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64, bundles: nsis, updater: "nsis/*-setup.exe" }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64, bundles: appimage, updater: "appimage/*.AppImage" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: github.event_name == 'push'
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          [ "${GITHUB_REF_NAME}" = "v$VERSION" ] || { echo "Tag ${GITHUB_REF_NAME} but tauri.conf.json is $VERSION"; exit 1; }

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - run: npm ci

      - name: Build configuration
        id: config
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # Release-only overrides, merged over src-tauri/tauri.conf.json.
          if [ "$RUNNER_OS" = macOS ]; then
            # Developer ID signing; the checked-in config stays ad-hoc signed.
            jq -n --arg id "$APPLE_SIGNING_IDENTITY" '{bundle:{createUpdaterArtifacts:true, macOS:{signingIdentity:$id}}}' > release.conf.json
            mkdir -p ~/private_keys && printf '%s' "$APPLE_API_KEY_P8" > ~/private_keys/notarize.p8
            echo "api_key_path=$HOME/private_keys/notarize.p8" >> "$GITHUB_OUTPUT"
          else
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > release.conf.json
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing (imported into a temporary keychain) and notarization.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTS_P12 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTS_P12_PW || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ steps.config.outputs.api_key_path }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config release.conf.json
          # Tag builds go into one draft release; manual runs only publish to eng-dash.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: Pebble ${{ github.ref_name }}
          releaseBody: Download the installer for your computer below. Pebble keeps itself up to date after that.
          releaseDraft: true
          # Updates come from eng-dash only, so no latest.json on the release.
          includeUpdaterJson: false

      - name: Check macOS signature and notarization
        if: runner.os == 'macOS'
        run: |
          APP=target/${{ matrix.target }}/release/bundle/macos/Pebble.app
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q allow-jit
          xcrun stapler validate "$APP"
          spctl --assess --type execute "$APP"

      - name: Publish updater bundle to eng-dash
        env:
          DESKTOP_RELEASE_SECRET: ${{ secrets.DESKTOP_RELEASE_SECRET }}
        run: |
          shopt -s nullglob
          set -- target/${{ matrix.target }}/release/bundle/${{ matrix.updater }}
          [ $# -eq 1 ] || { echo "Expected one updater bundle, found $#: $*"; exit 1; }
          BUNDLE=$1
          scripts/publish.sh "$TRACK" ${{ matrix.platform }} "$BUNDLE" "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: pebble-${{ matrix.platform }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
