[package]
name = "pebble-mac-key"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "pebble_mac_key"

[[bin]]
name = "pebble-extract-key"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = "1.22"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
sha2 = "0.10"
libc = "0.2"
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_x86"] }

[build-dependencies]
goblin = "0.10.7"
